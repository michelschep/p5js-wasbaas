<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧺 Was-hulp voor de Zielige Man</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080f1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      overflow-x: hidden;
      padding: 8px 0;
    }
    #canvas-container canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(60, 100, 220, 0.3);
      touch-action: none;
    }
    @media (max-width: 599px) {
      body {
        padding: 0;
        justify-content: flex-start;
      }
      #canvas-container canvas {
        border-radius: 0;
        box-shadow: none;
      }
      #subtitle { display: none; }
    }
    #subtitle {
      color: #4a6fa5;
      font-size: 12px;
      margin-top: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="subtitle">Een app voor mannen die plotseling alles zelf moeten doen</div>
  <script src="sketch.js"></script>
</body>
</html>
